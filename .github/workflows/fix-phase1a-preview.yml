name: One-time Phase 1A preview boot fix

on:
  push:
    branches:
      - phase-1-public-parity
    paths:
      - .github/workflows/fix-phase1a-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-public-parity
          fetch-depth: 0

      - name: Apply guarded patch
        run: python scripts/fix-phase1a-preview.py

      - name: Verify syntax and regression
        run: |
          node --check src/fixture/public-runtime.js
          grep -q "restbrDiningTitle" src/fixture/public-runtime.js
          grep -q "restbrDineInLabel" src/fixture/public-runtime.js
          grep -q 'restbr-logo-placeholder::after' css/fixture-shell.css
          ! grep -q "headerWrap.textContent = 'G'" src/fixture/public-runtime.js
          ! grep -q "introWrap.textContent = 'G'" src/fixture/public-runtime.js

      - name: Commit fix and clean temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-phase1a-preview.yml scripts/fix-phase1a-preview.py
          git add src/fixture/public-runtime.js css/fixture-shell.css
          git commit -m "Fix Phase 1A preview boot and dining copy"
          git push origin HEAD:phase-1-public-parity
