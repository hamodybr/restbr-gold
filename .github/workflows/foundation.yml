name: RESTBR Gold Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Architecture guard
        run: npm run check:architecture

      - name: Tests
        run: npm test

      - name: Syntax check core runtime
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
